[project]
name = "cifar10-optimization"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib",
    "torch",
    "torchvision",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
